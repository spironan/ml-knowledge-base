<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ML Shelf — Free AI/ML Learning Resources</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #E0D9C8;
    --surface: #FAF9F5;
    --surface-hover: #FFFFFF;
    --border: #57544A;
    --outline: rgba(193,95,60,0.55);
    --text: #141413;
    --text-muted: #6E6D66;
    --accent: #C15F3C;
    --accent-soft: rgba(217,119,87,0.12);
    --accent-hover: #D97757;
    --shadow: 0 2px 12px rgba(20,20,19,0.07);
    --radius: 10px;
    --transition: 0.2s ease;
  }

  [data-theme="dark"] {
    --bg: #262624;
    --surface: #30302E;
    --surface-hover: #393937;
    --border: #45443F;
    --outline: rgba(217,119,87,0.6);
    --text: #F5F4EF;
    --text-muted: #A6A39A;
    --accent: #D97757;
    --accent-soft: rgba(217,119,87,0.14);
    --accent-hover: #E48B6D;
    --shadow: 0 2px 12px rgba(0,0,0,0.35);
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    transition: background var(--transition), color var(--transition);
    min-height: 100vh;
  }

  .container { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

  /* ── Header ─────────────────────────────────── */
  header {
    padding: 40px 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .logo { display: flex; align-items: center; gap: 12px; }

  .logo-mark {
    width: 36px; height: 36px;
    background: var(--accent);
    border-radius: 8px;
    display: grid; place-items: center;
  }

  .logo-mark svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .logo h1 {
    font-family: 'Lora', Georgia, serif;
    font-size: 1.35rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .tagline {
    width: 100%;
    margin-top: -6px;
    font-size: 0.875rem;
    color: var(--text-muted);
  }

  .logo h1 span { color: var(--accent); }

  .header-right { display: flex; align-items: center; gap: 12px; }

  .resource-count {
    font-size: 0.8rem;
    color: var(--text-muted);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 20px;
    font-weight: 500;
  }

  .theme-toggle {
    width: 40px; height: 40px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    display: grid; place-items: center;
    transition: background var(--transition), border-color var(--transition);
  }

  .theme-toggle:hover { border-color: var(--accent); background: var(--accent-soft); }
  .theme-toggle svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ── Controls ────────────────────────────────── */
  .controls { padding-bottom: 28px; display: flex; flex-direction: column; gap: 16px; }

  .search-bar {
    position: relative;
    width: 100%;
    max-width: 420px;
  }

  .search-bar svg {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; stroke: var(--text-muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    pointer-events: none;
  }

  .search-bar input {
    width: 100%;
    padding: 10px 14px 10px 40px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 0.875rem;
    transition: border-color var(--transition);
    outline: none;
  }

  .search-bar input::placeholder { color: var(--text-muted); }
  .search-bar input:focus { border-color: var(--accent); }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; }

  .filter-pill {
    padding: 6px 16px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: transparent;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition);
    white-space: nowrap;
  }

  .filter-pill:hover { border-color: var(--accent); color: var(--text); }

  .filter-pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* ── Grid ────────────────────────────────────── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
    padding-bottom: 64px;
  }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 64px 24px;
    color: var(--text-muted);
  }

  .empty-state p { font-size: 0.95rem; }

  /* ── Card ────────────────────────────────────── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: all var(--transition);
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 3px;
    background: var(--card-accent);
    opacity: 0.7;
    transition: opacity var(--transition);
  }

  .card:hover {
    border-color: var(--accent);
    box-shadow: var(--shadow);
    transform: translateY(-2px);
  }

  .card:hover::before { opacity: 1; }

  .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }

  .card-title {
    font-family: 'Lora', Georgia, serif;
    font-size: 1.02rem;
    font-weight: 600;
    line-height: 1.4;
    letter-spacing: -0.01em;
  }

  .card-author {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-weight: 500;
  }

  .card-desc {
    font-size: 0.84rem;
    color: var(--text-muted);
    line-height: 1.55;
    flex: 1;
  }

  .card-footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: auto; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; }

  .tag {
    font-size: 0.7rem;
    font-weight: 500;
    padding: 3px 8px;
    border-radius: 4px;
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid var(--outline);
  }

  .card-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--accent);
    text-decoration: none;
    padding: 5px 11px;
    border: 1px solid var(--outline);
    border-radius: 6px;
    transition: background var(--transition);
    flex-shrink: 0;
  }

  .card-link:hover { background: var(--accent-soft); }
  .card-link svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ── Responsive ──────────────────────────────── */
  @media (max-width: 640px) {
    header { padding: 24px 0 20px; }
    .grid { grid-template-columns: 1fr; }
    .search-bar { max-width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; transform: none !important; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      </div>
      <h1>ML <span>Shelf</span></h1>
    </div>
    <div class="header-right">
      <span class="resource-count" id="count"></span>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg id="themeIcon" viewBox="0 0 24 24"></svg>
      </button>
    </div>
    <p class="tagline">Free, curated resources for learning AI &amp; ML — search anything, or filter by type.</p>
  </header>

  <div class="controls">
    <div class="search-bar">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search" placeholder="Search resources..." autocomplete="off">
    </div>
    <div class="filters" id="filters"></div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
// ── Resource Data ─────────────────────────────
// To add a resource: push an object to this array with the same shape.
// First category = primary grouping; entries are sorted by category → author → title.
const resources = [
  // ── Explainers ──
  {
    title: "Deep Dive into LLMs like ChatGPT",
    author: "Andrej Karpathy",
    categories: ["Explainers", "LLM", "YouTube"],
    description: "3.5-hour general-audience walkthrough of the full LLM training stack — pretraining, fine-tuning, RLHF, hallucinations, and mental models for using LLMs well. Part of his general-audience track alongside 'Intro to Large Language Models' and 'How I Use LLMs'.",
    url: "https://www.youtube.com/watch?v=7xTGNNLPyMI"
  },
  {
    title: "Neural Networks: Zero to Hero",
    author: "Andrej Karpathy",
    categories: ["Projects", "Deep Learning", "YouTube"],
    description: "Builds neural networks entirely from scratch in code — backpropagation, micrograd, makemore, and finally a GPT. The definitive hands-on deep learning series.",
    url: "https://www.youtube.com/playlist?list=PLAqhIrjkxbuWI23v9cThsA9GvCAUhRvKZ"
  },
  {
    title: "Neural Networks Series",
    author: "3Blue1Brown",
    categories: ["Explainers", "Neural Networks"],
    description: "Visual, intuition-first walkthrough of neural networks — backpropagation, gradient descent, and network architecture explained through elegant animations.",
    url: "https://www.3blue1brown.com/topics/neural-networks"
  },
  {
    title: "But What Is a GPT?",
    author: "3Blue1Brown",
    categories: ["Explainers", "Transformers"],
    description: "Accessible visual breakdown of GPT models — from token embeddings through transformer layers to next-token prediction. Chapter 5 of the deep learning series.",
    url: "https://www.3blue1brown.com/lessons/gpt"
  },
  {
    title: "Attention in Transformers",
    author: "3Blue1Brown",
    categories: ["Explainers", "Transformers"],
    description: "Visual explanation of the attention mechanism powering modern LLMs. Builds geometric intuition for queries, keys, and values. Chapter 6 of the deep learning series.",
    url: "https://www.3blue1brown.com/lessons/attention"
  },
  {
    title: "StatQuest: Machine Learning",
    author: "Josh Starmer",
    categories: ["Explainers", "ML Fundamentals", "YouTube"],
    description: "Step-by-step explanations of core ML and statistics — regression, trees, boosting, SVMs, neural networks — broken into small, clearly explained pieces.",
    url: "https://www.youtube.com/playlist?list=PLng25Lwn1Xd11NzZFwn8ZyLr-cwWvZi59"
  },

  // ── University Courses ──
  {
    title: "CS231N — CNNs for Visual Recognition",
    author: "Stanford University",
    categories: ["University Course", "Computer Vision"],
    description: "Stanford's flagship deep learning course. Full lectures, notes, and assignments covering convolutional networks, training methodology, and visual recognition.",
    url: "http://cs231n.stanford.edu/"
  },
  {
    title: "CS224N — NLP with Deep Learning",
    author: "Stanford University",
    categories: ["University Course", "NLP", "Transformers"],
    description: "Stanford's natural language processing course — word vectors, RNNs, transformers, and LLMs. Lectures, notes, and assignments freely available.",
    url: "https://web.stanford.edu/class/cs224n/"
  },
  {
    title: "6.S191 — Introduction to Deep Learning",
    author: "MIT",
    categories: ["University Course", "Deep Learning"],
    description: "MIT's fast-paced intro to deep learning — fundamentals through computer vision, NLP, and generative models. Lectures and labs published free each year.",
    url: "https://introtodeeplearning.com/"
  },
  {
    title: "Practical Deep Learning for Coders",
    author: "fast.ai",
    categories: ["University Course", "Deep Learning", "Projects"],
    description: "Top-down, code-first deep learning course. Trains state-of-the-art models from lesson one, then unpacks the theory underneath. Free book and videos.",
    url: "https://course.fast.ai/"
  },

  // ── Projects ──
  {
    title: "Build a Large Language Model (From Scratch)",
    author: "Sebastian Raschka",
    categories: ["Projects", "LLM"],
    description: "Repository implementing a GPT-style LLM step by step in PyTorch — pretraining, fine-tuning, and instruction tuning — with companion notebooks and videos.",
    url: "https://github.com/rasbt/LLMs-from-scratch"
  },
  {
    title: "LLM Course",
    author: "Hugging Face",
    categories: ["Projects", "LLM", "NLP"],
    description: "Hands-on course on transformers and the Hugging Face ecosystem — using, fine-tuning, and sharing models. Completely free, with runnable notebooks.",
    url: "https://huggingface.co/learn/llm-course/chapter1/1"
  },

  // ── Articles ──
  {
    title: "Large Language Models — Topic Hub",
    author: "GeeksForGeeks",
    categories: ["Articles", "LLM"],
    description: "Free article collection covering LLM fundamentals, architectures, fine-tuning, prompt engineering, and practical applications.",
    url: "https://www.geeksforgeeks.org/large-language-model-llm/"
  },
  {
    title: "The Illustrated Transformer",
    author: "Jay Alammar",
    categories: ["Articles", "Transformers"],
    description: "The canonical visual explainer of the transformer architecture — attention, multi-head mechanisms, and encoder-decoder flow, one diagram at a time.",
    url: "https://jalammar.github.io/illustrated-transformer/"
  },
  {
    title: "Dive into Deep Learning",
    author: "d2l.ai",
    categories: ["Articles", "Deep Learning"],
    description: "Free interactive deep learning book with runnable code in PyTorch, NumPy, and JAX. Adopted by hundreds of universities worldwide.",
    url: "https://d2l.ai/"
  },
  {
    title: "Machine Learning Crash Course",
    author: "Google",
    categories: ["Articles", "ML Fundamentals"],
    description: "Google's fast-paced, practical introduction to machine learning — short lessons with interactive visualizations and programming exercises.",
    url: "https://developers.google.com/machine-learning/crash-course"
  }
];

// ── Derived state ─────────────────────────────
const primaryCategories = ["Explainers", "University Course", "Projects", "Articles"];
let activeFilter = "All";
let searchQuery = "";

// ── Category accent map (card top strip) ─────
const categoryColor = {
  "Explainers": "#D97757",
  "University Course": "#6A9BCC",
  "Projects": "#788C5D",
  "Articles": "#D4A27F"
};
const fallbackAccent = "#C15F3C";

// ── SVG icon paths ────────────────────────────
const icons = {
  sun: '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>',
  moon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
  external: '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>'
};

// ── Theme ─────────────────────────────────────
const html = document.documentElement;
const themeIcon = document.getElementById("themeIcon");

function applyThemeIcon() {
  themeIcon.innerHTML = html.getAttribute("data-theme") === "dark" ? icons.sun : icons.moon;
}

document.getElementById("themeToggle").addEventListener("click", () => {
  html.setAttribute("data-theme", html.getAttribute("data-theme") === "dark" ? "light" : "dark");
  applyThemeIcon();
});

applyThemeIcon();

// ── Filters ───────────────────────────────────
const filtersEl = document.getElementById("filters");

function renderFilters() {
  const cats = ["All", ...primaryCategories];
  filtersEl.innerHTML = cats.map(c =>
    `<button class="filter-pill${c === activeFilter ? " active" : ""}" data-cat="${c}">${c}</button>`
  ).join("");
}

filtersEl.addEventListener("click", (e) => {
  const btn = e.target.closest(".filter-pill");
  if (!btn) return;
  activeFilter = btn.dataset.cat;
  renderFilters();
  renderGrid();
});

// ── Grid ──────────────────────────────────────
const gridEl = document.getElementById("grid");
const countEl = document.getElementById("count");

function renderGrid() {
  const q = searchQuery.toLowerCase();
  const filtered = resources.filter(r => {
    const matchesFilter = activeFilter === "All" || r.categories.includes(activeFilter);
    const matchesSearch = !q ||
      r.title.toLowerCase().includes(q) ||
      r.author.toLowerCase().includes(q) ||
      r.description.toLowerCase().includes(q) ||
      r.categories.some(c => c.toLowerCase().includes(q));
    return matchesFilter && matchesSearch;
  });

  countEl.textContent = `${filtered.length} resource${filtered.length !== 1 ? "s" : ""}`;

  if (!filtered.length) {
    gridEl.innerHTML = '<div class="empty-state"><p>No resources match your filters.</p></div>';
    return;
  }

  // Order: primary category (per primaryCategories) → author → title.
  // Keeps the same person's content together regardless of array order.
  filtered.sort((a, b) => {
    const ca = primaryCategories.indexOf(a.categories[0]);
    const cb = primaryCategories.indexOf(b.categories[0]);
    if (ca !== cb) return (ca === -1 ? 99 : ca) - (cb === -1 ? 99 : cb);
    if (a.author !== b.author) return a.author.localeCompare(b.author);
    return a.title.localeCompare(b.title);
  });

  gridEl.innerHTML = filtered.map(r => `
    <article class="card" style="--card-accent: ${categoryColor[r.categories[0]] || fallbackAccent}">
      <div class="card-header">
        <div class="card-title">${r.title}</div>
      </div>
      <div class="card-author">${r.author}</div>
      <p class="card-desc">${r.description}</p>
      <div class="card-footer">
        <div class="tags">
          ${r.categories.map(c => `<span class="tag">${c}</span>`).join("")}
        </div>
        <a class="card-link" href="${r.url}" target="_blank" rel="noopener noreferrer">
          Open <svg viewBox="0 0 24 24">${icons.external}</svg>
        </a>
      </div>
    </article>
  `).join("");
}

// ── Search ────────────────────────────────────
document.getElementById("search").addEventListener("input", (e) => {
  searchQuery = e.target.value;
  renderGrid();
});

// ── Init ──────────────────────────────────────
renderFilters();
renderGrid();
</script>
</body>
</html>
